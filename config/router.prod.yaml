public_url: "https://ai.vanscoding.com"

auth:
  teacher_domain: ""
  admin_emails:
    - "mz038197@gmail.com"
  google_client_id: ""
  google_client_secret: ""
  dev_auth_enabled: false
  open_registration: true

database:
  path: "/tmp/router.db"
  archive_dir: "/tmp/archive"
  url: ""

prompt_logs:
  archive_after_days: 15
  delete_after_days: 30

providers:
  ollama_cloud:
    type: openai_compatible
    base_url: "https://ollama.com/v1"
    api_key_envs:
      - OLLAMA_CLOUD_API_KEY
      - OLLAMA_CLOUD_API_KEY_2
    max_concurrent_per_key: 3
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    quarantine_ttl_sec: 3600
    enabled: true

  openrouter:
    type: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    api_key_envs:
      - OPENROUTER_API_KEY
      - OPENROUTER_API_KEY_2
    max_concurrent_per_key: 6
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    quarantine_ttl_sec: 3600
    enabled: true
    extra_headers:
      HTTP-Referer: "https://ai.vanscoding.com"
      X-Title: "Vans Coding Router"

  openai:
    type: openai_compatible
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    enabled: true

  anthropic:
    type: anthropic
    base_url: "https://api.anthropic.com/v1"
    # Messages API behind a router translation layer (ADR 0092); second env optional.
    api_key_envs:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_API_KEY_2
    max_concurrent_per_key: 10
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    quarantine_ttl_sec: 3600
    enabled: true

routing:
  default_provider: ollama_cloud

# Web Search (Tavily). One key, held as a secret. Without it POST /v1/search answers 503.
web_search:
  api_key_env: "TAVILY_API_KEY"

# OAuth Clients (ADR 0094). Uncomment only after VCR_OAUTH_SIGNING_KEY is set as a Fly secret:
# with a client registered and no signing key, production refuses to start.
# See guide/DEPLOYMENT.md (OAuth authorization server).
oauth:
  clients:
    # agent-builder: register once MiTAC replaces its localhost callback.
    # agent-builder:
    #   name: "MiTAC Agent Builder"
    #   redirect_uris:
    #     - "<the Agent Builder callback, once the platform shows a reachable one>"
    #   scopes: [classroom]
    #   client_secret_env: "VCR_OAUTH_AGENT_BUILDER_SECRET"
    club-booking-admin:
      name: "社團預約板"
      redirect_uris:
        - "https://club-booking-board.vercel.app/auth/callback"
      scopes: [openid, teacher]
