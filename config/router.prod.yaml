public_url: "https://ai.vanscoding.com"

auth:
  teacher_domain: ""
  admin_emails:
    - "mz038197@gmail.com"
  google_client_id: ""
  google_client_secret: ""
  dev_auth_enabled: false
  open_registration: true

database:
  path: "/tmp/router.db"
  archive_dir: "/tmp/archive"
  url: ""

prompt_logs:
  archive_after_days: 15
  delete_after_days: 30

providers:
  ollama_cloud:
    type: openai_compatible
    base_url: "https://ollama.com/v1"
    api_key_envs:
      - OLLAMA_CLOUD_API_KEY
      - OLLAMA_CLOUD_API_KEY_2
    max_concurrent_per_key: 3
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    quarantine_ttl_sec: 3600
    enabled: true

  openrouter:
    type: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    api_key_envs:
      - OPENROUTER_API_KEY
      - OPENROUTER_API_KEY_2
    max_concurrent_per_key: 6
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    quarantine_ttl_sec: 3600
    enabled: true
    extra_headers:
      HTTP-Referer: "https://ai.vanscoding.com"
      X-Title: "Vans Coding Router"

  openai:
    type: openai_compatible
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    enabled: true

  anthropic:
    type: anthropic
    base_url: "https://api.anthropic.com/v1"
    # Messages API behind a router translation layer (ADR 0092); second env optional.
    api_key_envs:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_API_KEY_2
    max_concurrent_per_key: 10
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    quarantine_ttl_sec: 3600
    enabled: true

routing:
  default_provider: ollama_cloud

# Web Search (Tavily). One key, held as a secret. Without it POST /v1/search answers 503.
web_search:
  api_key_env: "TAVILY_API_KEY"

# OAuth Clients (ADR 0094). Uncomment only after VCR_OAUTH_SIGNING_KEY is set as a Fly secret:
# with a client registered and no signing key, production refuses to start.
# See guide/DEPLOYMENT.md (OAuth authorization server).
oauth:
  clients:
    # MiTAC Agent Builder instances: 172.16.36.62 is MiTAC's test instance (reached over
    # VPN); the 台南一中 instance is 192.168.7.97 on the school network and
    # 210.70.137.97 from outside it (the school network cannot reach its own public
    # address), so both are registered. API Server connections call back on
    # /api/v1/identity/oauth/callback, MCP Server connections on
    # /api/v1/identity/mcp/oauth/callback, at the address the platform is set to.
    agent-builder:
      name: "MiTAC Agent Builder"
      redirect_uris:
        - "http://172.16.36.62/api/v1/identity/oauth/callback"
        - "http://210.70.137.97/api/v1/identity/oauth/callback"
        - "http://192.168.7.97/api/v1/identity/oauth/callback"
        # MCP Server connections (vans-mcp-server /mcp-oauth) call back on their own path.
        - "http://172.16.36.62/api/v1/identity/mcp/oauth/callback"
        - "http://210.70.137.97/api/v1/identity/mcp/oauth/callback"
        - "http://192.168.7.97/api/v1/identity/mcp/oauth/callback"
      scopes: [classroom]
      client_secret_sha256: "ff03203dc209d5a04483a98b8241f461db62455bb28b219aaf66759aaa17bf6a"
    club-booking-admin:
      name: "社團預約板"
      redirect_uris:
        - "https://club.vanscoding.com/auth/callback"
        - "https://club-booking-board.vercel.app/auth/callback"
      scopes: [openid, teacher]
      client_secret_sha256: "0e1a8df7dd3f56ff95f54627fdbf6dc9665e5c5662a03e966ce9e2de5c49d8f5"
    # 路考網站：學生走 classroom，老師走 openid teacher（road-test ADR 0003）。
    road-test:
      name: "路考網站"
      redirect_uris:
        - "https://lukao.vanscoding.com/auth/callback"
      scopes: [classroom, openid, teacher]
      client_secret_sha256: "e20277b6be2464e06a654e006265825aad88106f0689293b2b5d72cec3d91928"
