public_url: "http://127.0.0.1:8000"

auth:
  teacher_domain: ""
  admin_emails:
    - "mz038197@gmail.com"
  google_client_id: ""
  google_client_secret: ""
  session_secret: "change-me"
  dev_auth_enabled: true  # 僅限 loopback 本機開發
  open_registration: true

database:
  path: "~/.vans_coding_router/router.db"
  archive_dir: "~/.vans_coding_router/archive"
  # PostgreSQL via DATABASE_URL (Neon in production).
  url: ""

prompt_logs:
  archive_after_days: 15
  delete_after_days: 30

providers:
  ollama_cloud:
    type: openai_compatible
    base_url: "https://ollama.com/v1"
    # Prefer api_key_envs for dual-account least-in-flight + per-key queue.
    # Falls back to a single key if only one env is set.
    api_key_envs:
      - OLLAMA_CLOUD_API_KEY
      - OLLAMA_CLOUD_API_KEY_2
    max_concurrent_per_key: 3
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    quarantine_ttl_sec: 3600
    enabled: true

  openrouter:
    type: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    # Dual-account least-in-flight; second env optional (single-account if unset).
    api_key_envs:
      - OPENROUTER_API_KEY
      - OPENROUTER_API_KEY_2
    max_concurrent_per_key: 6
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    quarantine_ttl_sec: 3600
    enabled: true
    extra_headers:
      HTTP-Referer: "https://ai.vanscoding.com"
      X-Title: "Vans Coding Router"

  openai:
    type: openai_compatible
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    enabled: true

  anthropic:
    type: anthropic
    base_url: "https://api.anthropic.com/v1"
    # Messages API behind a router translation layer (ADR 0092); second env optional.
    api_key_envs:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_API_KEY_2
    max_concurrent_per_key: 10
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    quarantine_ttl_sec: 3600
    enabled: true

# Web Search (Tavily). One key, held as a secret. Without it POST /v1/search answers 503.
web_search:
  api_key_env: "TAVILY_API_KEY"

# Key Check (POST /internal/key-check): calls each Partner Service may make a minute. Over it: 429.
key_check:
  calls_per_minute_per_service: 600

# OAuth Clients of the Authorization Page (ADR 0094). Discovery is
# /.well-known/openid-configuration. redirect_uris match exactly (scheme, host, port, path, query).
# scopes: what the client may ask for, as scope tokens. `classroom` returns the student's
# Classroom API Key; `openid teacher` returns an ID token for a teacher or admin.
# A secret is optional: name its SHA-256 hex (client_secret_sha256) or the env var holding it
# (client_secret_env), never the secret itself. Without one the client is public (PKCE only).
# ID tokens are signed with VCR_OAUTH_SIGNING_KEY; on a loopback public_url a key is made at start.
oauth:
  clients:
    agent-builder:
      name: "MiTAC Agent Builder"
      redirect_uris:
        # Replace with the callback the Agent Builder platform shows for this tool.
        - "https://agent-builder.example/oauth/callback"
      scopes: [classroom]
      client_secret_env: "VCR_OAUTH_AGENT_BUILDER_SECRET"
    club-booking-admin:
      name: "社團預約板"
      redirect_uris:
        - "http://localhost:3000/auth/callback"
      scopes: [openid, teacher]
