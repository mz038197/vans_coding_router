public_url: "http://127.0.0.1:8000"
student_default_ttl_hours: 2

auth:
  teacher_domain: ""
  admin_emails:
    - "mz038197@gmail.com"
  google_client_id: ""
  google_client_secret: ""
  session_secret: "change-me-stg"
  open_registration: true

database:
  # 本機 stg 用 SQLite；不設 DATABASE_URL
  url: ""
  path: "~/.vans_coding_router/router.stg.db"
  archive_dir: "~/.vans_coding_router/archive_stg"

prompt_logs:
  archive_after_days: 15
  delete_after_days: 30

providers:
  ollama_cloud:
    type: openai_compatible
    base_url: "https://ollama.com/v1"
    api_key_envs:
      - OLLAMA_CLOUD_API_KEY
      - OLLAMA_CLOUD_API_KEY_2
    max_concurrent_per_key: 3
    queue_timeout_sec: 120
    acquire_delay_ms: 200
    enabled: true

  openrouter:
    type: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    enabled: true
    extra_headers:
      HTTP-Referer: "http://127.0.0.1:8000"
      X-Title: "Vans Coding Router (Stg)"

  openai:
    type: openai_compatible
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    enabled: true
    capabilities:
      - audio_speech
      - audio_transcription
